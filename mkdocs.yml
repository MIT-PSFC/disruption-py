---
site_name: DisruptionPy Documentation
theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    scheme: slate
    primary: custom
    accent: custom
extra_css:
  - stylesheets/disruptions.css
  - https://unpkg.com/katex@0/dist/katex.min.css
nav:
  - Home:
      - Overview: index.md
      - Workflow: workflow.md
      - Quickstart: quickstart.md
      - Examples: examples.md
  - Installation:
      - Installation: installation/install.md
      - Configuration: installation/configuration.md
      - Data access (MDSplus/SQL): installation/data_access.md
      - Troubleshooting: installation/troubleshooting.md
  - Devices:
      - Overview: devices/index.md
      - Generic physics methods: devices/generic.md
      - C-Mod:
          - Physics methods: devices/cmod/physics_methods.md
          - Parameter Reference: devices/cmod/parameters.md
          - disruption_warning dataset: devices/cmod/disruption_warning.md
      - DIII-D:
          - Physics methods: devices/d3d/physics_methods.md
          - Parameter Reference: devices/d3d/parameters.md
          - disruption_warning dataset: devices/d3d/disruption_warning.md
      - EAST:
          - Physics methods: devices/east/physics_methods.md
          - Parameter Reference: devices/east/parameters.md
      - HBT-EP:
          - Physics methods: devices/hbtep/physics_methods.md
          - Parameter Reference: devices/hbtep/parameters.md
      - MAST:
          - Physics methods: devices/mast/physics_methods.md
          - Parameter Reference: devices/mast/parameters.md
  - APIs:
      - Entry points:
          - Workflow: api/workflow.md
      - Settings:
          - Log Settings: api/settings/log_settings.md
          - Nickname Setting: api/settings/nickname_setting.md
          - Output Setting: api/settings/output_setting.md
          - Retrieval Settings: api/settings/retrieval_settings.md
          - Shotlist Setting: api/settings/shotlist_setting.md
          - Time Setting: api/settings/time_setting.md
      - Physics Methods:
          - Overview: api/physics_methods/overview.md
          - Decorators: api/physics_methods/decorators.md
      - Data I/O:
          - Data Connection (Base): api/data_io/data_connection.md
          - SQL Database: api/data_io/sql_database.md
          - MDSplus Connection: api/data_io/mds_connection.md
  - Links:
      - References: references.md
      - GitHub repo: https://github.com/MIT-PSFC/disruption-py
      - Issues: https://github.com/MIT-PSFC/disruption-py/issues
      - Changelog / Releases: https://github.com/MIT-PSFC/disruption-py/releases
  - Citing DisruptionPy: citing.md
markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: ['']
      dedent_subsections: true
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: ¤
plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            # https://mkdocstrings.github.io/python/usage/configuration/
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: true
            show_signature_annotations: true
            docstring_options:
              ignore_init_summary: true
            inherited_members: false
            merge_init_into_class: false
            separate_signature: true
            # members_order: source
            filters: []

            #  Heading options
            heading_level: 3
            show_root_heading: true
            show_root_full_path: true
            show_root_members_full_path: false
            show_object_full_path: false
extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
