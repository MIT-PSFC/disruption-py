[d3d.efit]
runtag = "DIS"

[d3d.inout.mds]
mdsplus_connection_string = "atlas"

[d3d.inout.sql]
db_name = "d3drdb"
driver = "FreeTDS"
host = "d3drdb"
port = 8001

[d3d.physics.attributes.aminor]
description = "Minor radius (EFIT)."
imas = "/equilibrium/time_slice(itime)/boundary/minor_radius"
units = "m"

[d3d.physics.attributes.beta_n]
description = "Normalized plasma beta computed from EFIT."
imas = "/summary/global_quantities/beta_tor_norm"
units = "dimensionless"
validity = [0.0, 2.0]

[d3d.physics.attributes.beta_p]
description = "Beta poloidal (EFIT)."
imas = "/equilibrium/time_slice(itime)/global_quantities/beta_pol"
units = "dimensionless"
validity = [0.0, 1.5]

[d3d.physics.attributes.beta_p_rt]
description = "Beta poloidal from real-time EFIT calculation."
imas = "/equilibrium/time_slice(itime)/global_quantities/beta_pol"
units = "dimensionless"
validity = [0.0, 1.5]

[d3d.physics.attributes.btor]
description = "Toroidal magnetic field strength."
imas = "/summary/global_quantities/b0/value"
units = "T"
validity = [-2.5, 2.5]

[d3d.physics.attributes.chisq]
description = "Magnetic chi^2 (EFIT)."
units = "dimensionless"
validity = [0.1, 70.0]

[d3d.physics.attributes.chisq_rt]
description = "Magnetic chi^2 from real-time EFIT calculation."
units = "dimensionless"
validity = [0.1, 70.0]

[d3d.physics.attributes.current_quench_time]
description = "Time of the current quench event. NaN for non-disruptive discharges."
units = "s"

[d3d.physics.attributes.dbetap_dt]
description = "Time derivative of the poloidal beta (EFIT)."
units = "s^-1"

[d3d.physics.attributes.dbetap_dt_rt]
description = "Time derivative of the poloidal beta from real-time EFIT calculation."
units = "s^-1"

[d3d.physics.attributes.delta]
description = "Triangularity at plasma boundary (EFIT)."
imas = "/equilibrium/time_slice(itime)/boundary/triangularity"
units = "dimensionless"

[d3d.physics.attributes.dip_dt]
description = "Time derivative of the actual plasma current."
units = "A/s"

[d3d.physics.attributes.dip_dt_rt]
description = "Time derivative of the real-time actual plasma current."
units = "A/s"

[d3d.physics.attributes.dipprog_dt]
description = "Time derivative of the programmed plasma current."
units = "A/s"
validity = [-5.0e6, 5.0e6]

[d3d.physics.attributes.dipprog_dt_rt]
description = "Time derivative of the real-time programmed plasma current."
units = "A/s"
validity = [-5.0e6, 5.0e6]

[d3d.physics.attributes.dli_dt]
description = "Time derivative of the internal inductance (EFIT)."
units = "s^-1"

[d3d.physics.attributes.dn_dt]
description = "Time derivative of the measured line-averaged electron density."
imas = "/summary/line_average/dn_e_dt"
units = "m^-3*s^-1"

[d3d.physics.attributes.dn_dt_rt]
description = "Time derivative of the measured line-averaged electron density available to PCS in real-time."
imas = "/summary/line_average/dn_e_dt"
units = "m^-3*s^-1"

[d3d.physics.attributes.dwmhd_dt]
description = "Time derivative of the total plasma energy (EFIT)."
units = "J/s"

[d3d.physics.attributes.greenwald_fraction]
description = "Greenwald fraction."
imas = "/summary/global_quantities/greenwald_fraction/value"
units = "dimensionless"
validity = [0.0, 1.5]

[d3d.physics.attributes.greenwald_fraction_rt]
description = "Greenwald fraction calculated from real-time density."
imas = "/summary/global_quantities/greenwald_fraction/value"
units = "dimensionless"
validity = [0.0, 1.5]

[d3d.physics.attributes.h98]
description = "H98 energy confinement time enhancement factor over the IPB98(y,2) scaling."
imas = "/summary/global_quantities/h_98"
units = "dimensionless"
validity = [0.05, 1.75]

[d3d.physics.attributes.h_alpha]
description = "H-alpha line emission intensity."
units = "W/(m^2*sr)"
validity = [0.0, 161.920898]

[d3d.physics.attributes.ip]
description = "Measured plasma current (Rogowski coil)."
imas = "/summary/global_quantities/ip/value"
units = "A"

[d3d.physics.attributes.ip_error]
description = "Difference between the measured and programmed plasma current."
units = "A"

[d3d.physics.attributes.ip_error_rt]
description = "Difference between the real-time measured and programmed plasma current."
units = "A"

[d3d.physics.attributes.ip_prog]
description = "Programmed plasma current."
imas = "/pulse_schedule/flux_control/ip/reference"
units = "A"

[d3d.physics.attributes.ip_prog_rt]
description = "Real-time programmed plasma current."
imas = "/pulse_schedule/flux_control/ip/reference"
units = "A"

[d3d.physics.attributes.ip_rt]
description = "Real-time measured plasma current (Rogowski coil)."
imas = "/summary/global_quantities/ip/value"
units = "A"

[d3d.physics.attributes.kappa]
description = "Elongation at plasma boundary (EFIT)."
imas = "/equilibrium/time_slice(itime)/boundary/elongation"
units = "dimensionless"
validity = [0.8, 2.0]

[d3d.physics.attributes.kappa_area]
description = "Elongation calculated using the plasma area and minor radius from EFIT."
imas = "/summary/boundary/elongation"
units = "dimensionless"
validity = [0.8, 2.0]

[d3d.physics.attributes.li]
description = "Normalized internal inductance, li(3) (EFIT)."
imas = "/equilibrium/time_slice(itime)/global_quantities/li_3"
units = "dimensionless"
validity = [0.2, 4.5]

[d3d.physics.attributes.li_rt]
description = "Normalized internal inductance, li(3) from real-time EFIT calculation."
imas = "/equilibrium/time_slice(itime)/global_quantities/li_3"
units = "dimensionless"
validity = [0.2, 4.5]

[d3d.physics.attributes.lower_gap]
description = "Bottom gap between x-point and wall (EFIT)."
imas = "/equilibrium/time_slice(itime)/boundary/gap(i1)/value"
units = "m"
validity = [0.025, 0.25]

[d3d.physics.attributes.n1rms]
description = "RMS amplitude of the n=1 magnetic field perturbation."
units = "T"
validity = [0.0, 0.02]

[d3d.physics.attributes.n1rms_normalized]
description = "RMS of the n=1 mode normalized to the toroidal magnetic field strength."
units = "dimensionless"

[d3d.physics.attributes.n_e]
description = "Measured line-averaged electron density."
imas = "/summary/line_average/n_e/value"
units = "m^-3"
validity = [0.2e20, 7.0e20]

[d3d.physics.attributes.n_e_rt]
description = "Real-time measured line-averaged electron density available to PCS."
imas = "/summary/line_average/n_e/value"
units = "m^-3"
validity = [0.2e20, 7.0e20]

[d3d.physics.attributes.n_equal_1_mode]
description = "Amplitude of the n=1 mode."
imas = "/mhd_linear/time_slice(itime)/toroidal_mode(i1)/plasma/b_field_perturbed"
units = "T"
validity = [0.0, 0.02]

[d3d.physics.attributes.n_equal_1_normalized]
description = "Amplitude of the n=1 mode normalized to the toroidal magnetic field."
units = "dimensionless"

[d3d.physics.attributes.ne_peaking_cva_rt]
description = "Peaking factor of the electron density profile, core vs all channels."
units = "dimensionless"

[d3d.physics.attributes.p_ech]
description = "Total electron cyclotron resonant heating power."
imas = "/summary/heating_current_drive/power_launched_ec/value"
units = "W"
validity = [0.0, inf]

[d3d.physics.attributes.p_nbi]
description = "Total neutral beam injection heating power."
imas = "/summary/heating_current_drive/power_launched_nbi/value"
units = "W"
validity = [0.0, inf]

[d3d.physics.attributes.p_ohm]
description = "Total Ohmic heating power."
imas = "/summary/global_quantities/power_ohm/value"
units = "W"
validity = [0.0, 5.0e6]

[d3d.physics.attributes.p_rad]
description = "Total radiated power measured by 2pi foil bolometer."
imas = "/bolometer/power_radiated_total"
units = "W"
validity = [0.0, inf]

[d3d.physics.attributes.power_supply_railed]
description = "Power supply railed signal indicator for PCS feedback control of Ip."
units = "dimensionless"
validity = [0.0, 1.0]

[d3d.physics.attributes.prad_peaking_cva_rt]
description = "Peaking factor for the radiated power, core vs all-but-divertor channels."
units = "dimensionless"

[d3d.physics.attributes.prad_peaking_xdiv_rt]
description = "Peaking factor for the radiated power, divertor vs all-but-core channels."
units = "dimensionless"

[d3d.physics.attributes.q0]
description = "Safety factor at magnetic axis (EFIT)."
imas = "/equilibrium/time_slice(itime)/global_quantities/q_axis"
units = "dimensionless"
validity = [0.0, 2.0]

[d3d.physics.attributes.q95]
description = "Safety factor at 95% flux surface (EFIT)."
imas = "/equilibrium/time_slice(itime)/global_quantities/q_95"
units = "dimensionless"
validity = [0.0, inf]

[d3d.physics.attributes.q95_rt]
description = "Safety factor at 95% flux surface from real-time EFIT calculation."
imas = "/equilibrium/time_slice(itime)/global_quantities/q_95"
units = "dimensionless"
validity = [0.0, inf]

[d3d.physics.attributes.qstar]
description = "Equivalent (kink) safety factor (EFIT)."
units = "dimensionless"
validity = [0.0, inf]

[d3d.physics.attributes.radiated_fraction]
description = "Total radiated power fraction."
units = "dimensionless"
validity = [0.0, 15.0]

[d3d.physics.attributes.squareness]
description = "Average of lower-outer and upper-outer squareness, T. Luce PPCF 55 (2013) 095009."
units = "dimensionless"

[d3d.physics.attributes.te_peaking_cva_rt]
description = "Peaking factor of the electron temperature profile, core vs all channels."
units = "dimensionless"
validity = [0.0, inf]

[d3d.physics.attributes.time_until_disrupt]
description = "Time until the current quench. NaN for non-disruptive discharges."
units = "s"

[d3d.physics.attributes.upper_gap]
description = "Top gap between x-point and wall (EFIT)."
imas = "/equilibrium/time_slice(itime)/boundary/gap(i1)/value"
units = "m"
validity = [0.0, inf]

[d3d.physics.attributes.v_loop]
description = "Measured loop voltage."
imas = "/summary/global_quantities/v_loop/value"
units = "V"
validity = [-7.0, 7.0]

[d3d.physics.attributes.wmhd]
description = "Total plasma energy (EFIT)."
imas = "/equilibrium/time_slice(itime)/global_quantities/energy_mhd"
units = "J"
validity = [5.0e3, 3.0e5]

[d3d.physics.attributes.wmhd_rt]
description = "Total plasma energy from real-time EFIT calculation."
imas = "/equilibrium/time_slice(itime)/global_quantities/energy_mhd"
units = "J"
validity = [5.0e3, 3.0e5]

[d3d.physics.attributes.z_eff]
description = "Effective charge."
imas = "/summary/local/magnetic_axis/zeff/value"
units = "dimensionless"

[d3d.physics.attributes.zcur]
description = "Measured vertical position of the plasma current centroid."
imas = "/equilibrium/time_slice(itime)/global_quantities/current_centre/z"
units = "m"
validity = [-0.5, 0.5]

[d3d.physics.attributes.zcur_normalized]
description = "Measured vertical position of the plasma current centroid normalized to plasma minor radius."
units = "dimensionless"

[d3d.physics.bradial_path]
mds_trees = "/fusion/projects/disruption_warning/software/recalc_bradial/bradial"
recalc_nc = "/fusion/projects/disruption_warning/software/recalc_bradial/recalc.nc"

[d3d.physics.current_quench_time_thresholds]
abs_ip0 = 0.1e6
abs_ip_final = 100e3
abs_ip_max = 0.1e6
ip0_over_ip_max = 0.33
ip0_over_max_didt = 0.05
shot_duration = 0.5

[d3d.physics.time_domain_thresholds]
dipprog_dt = 2e3
ip_prog = 100e3
power_supply_railed = 1

