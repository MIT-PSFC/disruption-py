units = "A/s"

[cmod.physics.attributes.dip_smoothed]
description = "Time derivative of the smoothed measured plasma current"
latex = '$dI_{p,\mathrm{smooth}}/dt$'
source = "Magnetics (Rogowski coil)"
units = "A/s"

[cmod.physics.attributes.dipprog_dt]
description = "Time derivative of the programmed plasma current"
latex = '$dI_{p,\mathrm{prog}}/dt$'
source = "Plasma control system (PCS)"
units = "A/s"
validity = [-5.0e6, 5.0e6]

[cmod.physics.attributes.dli_dt]
description = "Time derivative of the internal inductance (EFIT)"
latex = '$d\ell_i/dt$'
source = "EFIT"
units = "s^-1"

[cmod.physics.attributes.dn_dt]
description = "Time derivative of the measured line-averaged electron density"
imas = "/summary/line_average/dn_e_dt"
latex = '$d\bar{n}_e/dt$'
source = "Two-color interferometer (TCI)"
units = "m^-3*s^-1"

[cmod.physics.attributes.dprad_dt]
description = "Time derivative of the measured total radiated power"
latex = '$dP_{\mathrm{rad}}/dt$'
source = "Bolometer (2pi diode)"
units = "W/s"

[cmod.physics.attributes.dwmhd_dt]
description = "Time derivative of the total plasma energy (EFIT)"
latex = '$dW_{\mathrm{MHD}}/dt$'
source = "EFIT"
units = "J/s"

[cmod.physics.attributes.greenwald_fraction]
description = "Greenwald fraction"
imas = "/summary/global_quantities/greenwald_fraction/value"
latex = '$f_{\mathrm{GW}}$'
source = "Two-color interferometer (TCI), Magnetics (Rogowski coil), EFIT"
units = "dimensionless"
validity = [0.0, 1.5]

[cmod.physics.attributes.h98]
description = "H98 energy confinement time enhancement factor over the IPB98(y,2) scaling"
imas = "/summary/global_quantities/h_98"
latex = '$H_{98(y,2)}$'
source = "EFIT, Two-color interferometer (TCI), Magnetics, Heating systems"
units = "dimensionless"
validity = [0.05, 1.75]

[cmod.physics.attributes.h_alpha]
